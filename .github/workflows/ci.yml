name: CI
on:
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Build & test
        working-directory: backend
        run: |
          for attempt in 1 2 3; do
            if output=$(./gradlew build --no-daemon 2>&1); then
              printf '%s\n' "$output"
              exit 0
            else
              status=$?
              printf '%s\n' "$output"
            fi
            if ! grep -q 'status code 429' <<< "$output" || [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep $((attempt * 30))
          done

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  embedding:
    name: Embedding (Python syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        working-directory: embedding
        run: python -m py_compile app/main.py
