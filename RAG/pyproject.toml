[project]
name = "jipsa-rag"
version = "0.1.0"
description = "FastAPI-based document processing and RAG service for Jipsa."
readme = "README.md"
authors = [
    { name = "안수현", email = "soxyxs4996@gmail.com" }
]
requires-python = ">=3.12,<3.13"

dependencies = [
    # =========================================================
    # [Database]
    # - Local RAG MySQL 데이터베이스 비동기 연결
    # - MySQL caching_sha2_password 인증 처리
    # - SQLAlchemy ORM 및 Alembic 마이그레이션 관리
    # =========================================================
    "alembic>=1.18.5,<2.0",
    "asyncmy>=0.2,<1.0",
    "cryptography>=49.0.0,<50.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",

    # =========================================================
    # [Web API]
    # - FastAPI 애플리케이션 구성
    # - Uvicorn ASGI 서버 실행
    # =========================================================
    "fastapi>=0.139.0,<1.0",
    "uvicorn[standard]>=0.35,<1.0",

    # =========================================================
    # [HTTP Client]
    # - 애플리케이션 서버와의 비동기 HTTP 통신
    # - Presigned GET URL을 통한 원본 파일 다운로드
    # - Starlette/FastAPI 테스트에서 사용하는 내부 HTTP 클라이언트
    #
    # RAG 서버는 boto3와 AWS 자격 증명을 사용하여 S3에 직접 접근하지 않는다.
    # =========================================================
    "httpx2>=2.5.0,<3.0",

    # =========================================================
    # [LLM Generation]
    # - Anthropic Claude API 비동기 생성 클라이언트 구현
    # - SDK 요청·응답 타입과 예외를 인프라 계층 내부에 격리
    # - API Key는 소스 코드가 아닌 환경 변수로 주입
    # =========================================================
    "anthropic>=0.118.0,<0.119.0",

    # =========================================================
    # [Document Parsing]
    # - PDF 페이지 텍스트와 원본 페이지 위치 추출
    # - DOCX 문단·제목·목록·표 및 섹션 위치 추출
    # - PPTX 슬라이드·도형·표·발표자 노트 추출
    # - XLSX 시트·셀·병합 셀·표·저장된 수식 결과 추출
    # - TXT 인코딩 감지와 바이너리 파일 거부
    # =========================================================
    "charset-normalizer>=3.4.0,<4.0",
    "openpyxl>=3.1.5,<4.0",
    "pillow>=11.0.0,<13.0",
    "pypdf>=6.14.2,<7.0",
    "python-docx>=1.2.0,<2.0",
    "python-pptx>=1.0.2,<2.0",

    # =========================================================
    # [Image Extraction and Rendering]
    # - PyMuPDF로 PDF 임베디드 이미지 및 스캔 페이지 렌더링
    # - OpenCV/NumPy로 OCR 입력 이미지를 안전하게 디코딩
    # - Windows에 설치된 PowerPoint·Excel 2024를 pywin32 COM으로 제어
    # - PPTX 차트·SmartArt와 XLSX 차트를 원본 Office 렌더러로 직접 PNG 출력
    # =========================================================
    "numpy>=2.0.0,<3.0",
    "opencv-python-headless>=4.10.0,<5.0",
    "pymupdf>=1.26.0,<2.0",
    "pywin32==312; sys_platform == 'win32'",

    # =========================================================
    # [CUDA OCR]
    # - EasyOCR 기반 한국어·영어 이미지 문자 인식
    # - CUDA 12.9용 PyTorch wheel을 명시적으로 고정
    # - 코드 기본값은 다운로드 금지이며 로컬 dotenv에서 최초 다운로드를 명시적으로 허용
    #
    # torch/torchvision은 아래 [tool.uv.sources]의 pytorch-cu129 인덱스에서만
    # 설치되므로 CPU wheel이 우연히 선택되는 문제를 방지한다.
    # =========================================================
    "easyocr>=1.7.2,<2.0",
    "torch==2.8.0",
    "torchvision==0.23.0",

    # =========================================================
    # [Configuration]
    # - 환경별 dotenv 파일 관리
    # - 타입 안전한 환경 변수 검증
    # - DB 비밀번호와 같은 비밀값의 로그 노출 방지
    # =========================================================
    "pydantic-settings>=2.14.2,<3.0",

    # =========================================================
    # [Logging]
    # - 운영 환경에서 사용할 구조화된 JSON 로그 출력
    # - Request ID 기반 서버 간 요청 추적
    # =========================================================
    "python-json-logger>=4.1.0,<5.0",

    # =========================================================
    # [Retry]
    # - 애플리케이션 서버 및 Presigned GET URL의 일시적 통신 실패 재시도
    # - 만료 URL, 권한 오류 및 잘못된 요청에는 재시도하지 않음
    # =========================================================
    "tenacity>=9.1.4,<10.0",

    # =========================================================
    # [Vector Database]
    # - 청크 임베딩 벡터 저장
    # - 사용자 및 활성 상태 기반 관련 청크 검색
    # - 로컬 메모리 모드를 이용한 검색 통합 테스트
    # =========================================================
    "qdrant-client>=1.18.0,<1.19.0",
]


# =============================================================
# CUDA 12.9 PyTorch 전용 인덱스
# =============================================================
[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true


# =============================================================
# 실행 명령
# =============================================================
[project.scripts]
jipsa-rag = "jipsa_rag.main:main"


# =============================================================
# Build System
# =============================================================
[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"


# =============================================================
# 개발 및 테스트 전용 의존성
# =============================================================
[dependency-groups]
# types-openpyxl은 Workbook.active와 Chartsheet 등 일부 공개 API를 실제
# openpyxl 3.1.5 런타임보다 좁게 선언하여 정상 코드에 잘못된 타입 오류를 만든다.
# 따라서 해당 비공식 stub은 설치하지 않고, openpyxl import 지점에서만
# import-untyped를 명시적으로 격리해 프로젝트 내부의 Mypy strict 검사는 유지한다.
dev = [
    "mypy>=2.2.0,<3.0",
    "pytest>=9.1.1,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "pytest-cov>=7.1.0,<8.0",
    "ruff>=0.15.21,<1.0",
    "types-pywin32==312.0.0.20260609; sys_platform == 'win32'",
]


# =============================================================
# Pytest
# =============================================================
[tool.pytest.ini_options]
addopts = "-ra -q --strict-config --strict-markers --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"


# =============================================================
# Ruff
# =============================================================
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


# =============================================================
# Mypy
# =============================================================
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true

